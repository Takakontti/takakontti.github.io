<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="{{ page.description | default: site.description | escape }}" />
    <title>{{ page.title | default: site.title | escape }} — {{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/landing.css' | relative_url }}" />
  </head>
  <body>
    <div class="site-frame">
      <header class="site-header">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Takakontti home">
          <img class="brand-icon" src="{{ '/img/spurdoro.png' | relative_url }}" alt="" />
          <span>Takakontti</span>
        </a>
        <nav class="header-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/' | relative_url }}#projects">Projects</a>
          <a href="https://github.com/takakontti" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </header>

      <div class="page-layout">
        <aside class="sidebar" aria-label="Site navigation">
          <p class="sidebar-label">TAKAKONTTI</p>
          <nav>
            <a class="sidebar-link" href="{{ '/' | relative_url }}#about">Overview</a>
            <p class="sidebar-label sidebar-spaced">MY WORK</p>
            <a class="sidebar-link" href="{{ '/' | relative_url }}#projects">Projects</a>
            <a class="sidebar-link" href="{{ '/' | relative_url }}#tools">Web tools</a>
            <a class="sidebar-link sidebar-tool" href="{{ '/all-ears/' | relative_url }}"><span class="status-dot" aria-hidden="true"></span>All Ears tracker</a>
          </nav>
          <div class="sidebar-bottom">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Personal projects<br />and small tools</span>
          </div>
        </aside>

        <main class="main-content">
          <div class="breadcrumb"><a href="{{ '/' | relative_url }}">Home</a><span aria-hidden="true">/</span><span>Overview</span></div>
          <article class="markdown-content">
            {{ content }}
          </article>
          <footer class="site-footer">
            <span>© {{ 'now' | date: '%Y' }} Takakontti</span>
            <a href="{{ '/privacy.html' | relative_url }}">Privacy</a>
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
